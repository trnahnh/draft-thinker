server:
  port: 8080
  read_timeout: 30
  write_timeout: 120
  idle_timeout: 60

drafter:
  provider: openai
  base_url: https://api.openai.com/v1
  model: gpt-4.1-nano
  timeout: 30

heavyweight:
  provider: openai
  base_url: https://api.openai.com/v1
  model: gpt-4.1
  timeout: 60

entropy:
  threshold: 2.0
  window_size: 10
  early_exit_count: 10
  top_logprobs: 5

speculative:
  enabled: true
  soft_threshold_mult: 0.8

metrics:
  enabled: true
  path: /metrics
